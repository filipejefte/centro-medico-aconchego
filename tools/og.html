<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cartão de compartilhamento</title>
<style>
  /* Página de ferramenta, renderizada só pelo Chrome headless para virar
     assets/img/og.png. Não vai para o site, por isso o estilo mora aqui.
     Toda cor é declarada: o headless renderiza em tema escuro por padrão. */
  @font-face {
    font-family: 'Mulish';
    src: url('../assets/fonts/mulish.woff2') format('woff2');
    font-weight: 300 900;
  }
  @font-face {
    font-family: 'Source Serif';
    src: url('../assets/fonts/source-serif.woff2') format('woff2');
    font-weight: 300 800;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 66px 72px 60px;
    background: #143043;
    background-image:
      radial-gradient(900px 620px at 88% -12%, rgba(49, 111, 152, .85), rgba(49, 111, 152, 0) 62%),
      radial-gradient(720px 520px at 4% 108%, rgba(169, 83, 47, .34), rgba(169, 83, 47, 0) 60%);
    color: #d9e6ef;
    font-family: 'Mulish', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .marca { display: flex; align-items: center; gap: 26px; }
  .marca img { width: 470px; height: auto; display: block; }

  .selo {
    align-self: flex-start;
    border: 1.5px solid rgba(255, 255, 255, .28);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .04em;
    color: #b7cddc;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Source Serif', Georgia, serif;
    font-size: 66px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -.022em;
    color: #ffffff;
    max-width: 15ch;
  }

  .rodape { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }

  .unidades { display: flex; gap: 16px; }

  .unidade {
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: rgba(255, 255, 255, .09);
    border: 1.5px solid rgba(255, 255, 255, .17);
    border-radius: 16px;
    padding: 14px 22px 16px;
  }
  .unidade b {
    font-family: 'Source Serif', Georgia, serif;
    font-size: 38px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
  }
  .unidade span {
    font-size: 20px;
    font-weight: 600;
    color: #b7cddc;
    line-height: 1.2;
  }
  .unidade i { display: block; font-style: normal; font-size: 15px; color: #8fb0c6; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }

  .mant { text-align: right; font-size: 20px; line-height: 1.45; color: #9fbdd1; width: 300px; flex: none; }
  .mant b { color: #ffffff; font-weight: 700; }
</style>
</head>
<body>
  <div class="marca">
    <img src="../assets/img/logo-aconchego-branco.png" alt="">
  </div>

  <h1>Consultas, exames e cirurgias em Marília.</h1>

  <div class="rodape">
    <div class="unidades">
      <div class="unidade">
        <b>430</b>
        <span><i>Alto Cafezal</i>Centro Médico</span>
      </div>
      <div class="unidade">
        <b>340</b>
        <span><i>Alto Cafezal</i>Diagnóstico por Imagem</span>
      </div>
    </div>
    <p class="mant">Mantido pelo <b>Hospital Espírita de Marília</b> desde 1948</p>
  </div>
</body>
</html>
